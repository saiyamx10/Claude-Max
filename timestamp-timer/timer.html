<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10-Second Timestamp Timer</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f121c;color:#e6ebf5;font-family:system-ui,sans-serif;text-align:center}
h1{font-size:clamp(18px,3.4vw,40px)} #clock{font:700 clamp(48px,13vw,150px) ui-monospace,monospace;color:#78dcff}
#clock small{font-size:.55em}#bar{width:min(80vw,900px);height:24px;background:#282e42;border-radius:12px;margin:24px auto;overflow:hidden}
#fill{height:100%;width:0;background:#78dcff} button{font-size:20px;padding:10px 28px;border-radius:8px;border:0;cursor:pointer}
</style>
<h1>October 06 — 8:56:50 PM to 8:57:00 PM</h1>
<div id="clock">8:56:50 PM</div>
<div id="bar"><div id="fill"></div></div>
<div id="el">Elapsed 0.0s / Duration 10s</div><br>
<button id="go">Start</button>
<script>
const S=20*3600+56*60+50,D=10,$=id=>document.getElementById(id);
const fmt=s=>{const h=s/3600|0,m=s/60%60|0,x=s%60;return`${h%12||12}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")} ${h>=12?"PM":"AM"}`};
function show(t){const ms=String(Math.floor(t%1*1000)).padStart(3,"0"),[a,b]=fmt(S+Math.floor(t)).split(" ");$("clock").innerHTML=`${a}<small>.${ms}</small> ${b}`;$("fill").style.width=t/D*100+"%";$("el").textContent=`Elapsed ${t.toFixed(1)}s / Duration 10s`}
$("go").onclick=()=>{const t0=performance.now();(function f(n){const t=Math.min((n-t0)/1000,D);show(t);if(t<D)requestAnimationFrame(f)})(t0)};
</script>
